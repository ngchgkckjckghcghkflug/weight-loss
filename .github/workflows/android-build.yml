name: Build Capacitor Android App (Debug)

# Controls when the workflow will run
on:
  push:
    branches: [ main ] # Triggers the workflow on push events but only for the main branch
  workflow_dispatch:   # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest # Use the latest Ubuntu runner environment

    steps:
      # 1. Check out your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK (Required for Android builds)
      #    Adjust 'java-version' if your project needs a different one (e.g., '17')
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Popular OpenJDK distribution
          java-version: '21'

      # 3. Set up Node.js (Required for npm, Capacitor CLI)
      #    Adjust 'node-version' if needed
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use a recent LTS version
          cache: 'npm'       # Cache npm dependencies

      # 4. Install Node.js dependencies (using npm ci for cleaner installs in CI)
      - name: Install dependencies
        run: npm ci

      # 5. Add the Android platform to the Capacitor project <<-- ADD THIS STEP
      #    This configures the project and creates the android/ folder if needed
      - name: Add Android Platform
        run: npx cap add android

      # 5. Sync Capacitor project (copies web assets, updates native project)
      - name: Capacitor Sync
        run: npx cap sync android

      # 6. Setup Android SDK
      #    This action downloads and sets up the necessary Android command-line tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # You might need to add environment variables here later for release builds
        # env:
        #   ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 7. Make gradlew executable (Gradle Wrapper)
      #    Sometimes needed in Linux environments
      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      # 8. Build Android Debug APK
      #    Navigates into the android directory and runs the debug build task
      - name: Build Debug APK
        run: |
          cd ./android
          ./gradlew assembleDebug --no-daemon
          cd .. # Go back to root directory

      # 9. Upload Debug APK as Artifact
      #    This makes the generated APK available for download from the Actions run page
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk # Name of the artifact zip file
          path: android/app/build/outputs/apk/debug/app-debug.apk # Path to the generated APK
