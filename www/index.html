<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Tester</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Test Local Notifications</h1>

    <div class="form-group">
        <label for="titleInput">Notification Title:</label>
        <input type="text" id="titleInput" value="Test Notification">
    </div>

    <div class="form-group">
        <label for="bodyInput">Notification Body:</label>
        <input type="text" id="bodyInput" value="This is the notification message.">
    </div>

    <div class="form-group">
        <label for="delayInput">Delay (in seconds):</label>
        <input type="number" id="delayInput" value="5" min="0">
    </div>

    <button id="scheduleButton">Schedule Notification</button>

    <div id="statusArea">
        Status: Waiting for input...
    </div>

    <script src="script.js"></script>
</body>
</html>
